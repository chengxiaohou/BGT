name: 部署到 Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 触发 Render 部署
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK" -w "\nHTTP %{http_code}\n"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}