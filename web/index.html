<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站字幕提取</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --card-bg: #fff;
            --card-shadow: rgba(0,0,0,0.08);
            --input-border: #d2d2d7;
            --input-focus: #0071e3;
            --input-focus-shadow: rgba(0,113,227,0.15);
            --btn-primary-bg: #0071e3;
            --btn-primary-hover: #0060c9;
            --btn-primary-disabled: #999;
            --btn-secondary-bg: #e8e8ed;
            --btn-secondary-hover: #d2d2d7;
            --btn-secondary-text: #1d1d1f;
            --log-bg: #1d1d1f;
            --log-text: #a1ef80;
            --log-error: #ff6b6b;
            --log-warn: #ffd93d;
            --result-text-bg: #fafafa;
            --result-text-border: #e8e8ed;
            --error-bg: #fff0f0;
            --error-border: #ffc0c0;
            --error-text: #c41e3a;
            --label-text: #333;
            --footer-link: #86868b;
            --footer-link-hover: #1d1d1f;
            --toggle-bg: #e8e8ed;
            --toggle-hover: #d2d2d7;
        }

        [data-theme="dark"] {
            --bg: #1a1a1e;
            --text: #e5e5e7;
            --text-secondary: #8e8e93;
            --card-bg: #2c2c2e;
            --card-shadow: rgba(0,0,0,0.3);
            --input-border: #48484a;
            --input-focus: #0a84ff;
            --input-focus-shadow: rgba(10,132,255,0.2);
            --btn-primary-bg: #0a84ff;
            --btn-primary-hover: #409cff;
            --btn-primary-disabled: #555;
            --btn-secondary-bg: #3a3a3c;
            --btn-secondary-hover: #48484a;
            --btn-secondary-text: #e5e5e7;
            --log-bg: #111;
            --log-text: #5cd45c;
            --log-error: #ff6b6b;
            --log-warn: #ffd93d;
            --result-text-bg: #1c1c1e;
            --result-text-border: #38383a;
            --error-bg: #3a1a1a;
            --error-border: #6b2a2a;
            --error-text: #ff6b6b;
            --label-text: #d1d1d6;
            --footer-link: #8e8e93;
            --footer-link-hover: #e5e5e7;
            --toggle-bg: #3a3a3c;
            --toggle-hover: #48484a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }
        header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        header h1 .version {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 8px;
        }
        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        header p {
            color: var(--text-secondary);
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .theme-toggle {
            background: var(--toggle-bg);
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            line-height: 1;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }
        .theme-toggle:hover { background: var(--toggle-hover); }
        .theme-toggle svg { display: block; }
        .theme-toggle .moon { color: #e8e8ed; }
        .theme-toggle .sun { color: var(--text); }
        .settings-toggle {
            background: var(--toggle-bg);
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            line-height: 1;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            color: var(--text);
        }
        .settings-toggle:hover { background: var(--toggle-hover); }
        .settings-toggle svg { display: block; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            min-width: 360px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .modal-header h2 { font-size: 16px; font-weight: 600; color: var(--text); }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 20px;
            padding: 4px;
        }
        .modal-close:hover { color: var(--text); }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 3px var(--card-shadow);
            transition: background 0.2s, box-shadow 0.2s;
            margin-top: 16px;
        }
        .card:first-of-type { margin-top: 0; }
        .card:has(> .log-area:not(.active)) { display: none; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--label-text);
        }
        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--card-bg);
            color: var(--text);
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--input-focus-shadow);
        }
        .form-group input[type="file"] {
            padding: 8px 0;
            border: none;
            font-size: 14px;
        }
        .form-group input[type="file"]::file-selector-button {
            padding: 6px 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--btn-secondary-bg);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }
        .form-group input[type="file"]::file-selector-button:hover {
            background: var(--btn-secondary-hover);
        }
        .form-group .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--btn-primary-bg);
            color: #fff;
            width: 100%;
        }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-primary:disabled {
            background: var(--btn-primary-disabled);
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            font-size: 13px;
            padding: 6px 16px;
        }
        .btn-secondary:hover { background: var(--btn-secondary-hover); }
        .btn-link {
            background: none;
            border: none;
            color: var(--btn-primary-bg);
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            padding: 0;
            margin-left: 4px;
        }
        .btn-link:hover { color: var(--btn-primary-hover); }
        .cookie-status {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .cookie-status .saved { color: #34c759; }

        .log-area {
            background: var(--log-bg);
            color: var(--log-text);
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            font-size: 13px;
            padding: 16px;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
        .log-area.active { display: block; }
        .log-area .log-error { color: var(--log-error); }
        .log-area .log-info { color: var(--log-text); }
        .log-area .log-warn { color: var(--log-warn); }

        .result-area { display: none; }
        .result-area.active { display: block; }
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .result-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .result-text {
            background: var(--result-text-bg);
            border: 1px solid var(--result-text-border);
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.7;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            transition: background 0.2s, border-color 0.2s;
        }
        .result-footer {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }

        .error-banner {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--error-text);
            font-size: 14px;
            display: none;
        }
        .error-banner.active { display: block; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--footer-link);
            font-size: 12px;
        }
        footer .version { margin-right: 8px; }
        footer a { color: var(--footer-link); text-decoration: underline; transition: color 0.2s; }
        footer a:hover { color: var(--footer-link-hover); }

        /* ── UP 主关注 ── */
        .up-section {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 0;
            min-height: 44px;
        }
        .up-section-label {
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .up-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: var(--btn-secondary-bg);
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s;
            white-space: nowrap;
        }
        .up-pill:hover { background: var(--btn-secondary-hover); }
        .up-pill .up-remove {
            font-size: 14px;
            line-height: 1;
            color: var(--text-secondary);
            cursor: pointer;
            margin-left: 2px;
        }
        .up-pill .up-remove:hover { color: var(--log-error); }
        .up-add-btn {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 4px 10px;
            background: none;
            border: 1px dashed var(--input-border);
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .up-add-btn:hover {
            border-color: var(--input-focus);
            color: var(--input-focus);
        }

        /* ── 视频列表弹窗 ── */
        .video-list-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .video-list-modal.active { display: flex; }
        .video-list-modal .modal {
            min-width: 480px;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .video-list-modal .modal-body {
            overflow-y: auto;
            flex: 1;
        }
        .video-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--result-text-border);
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .video-item:last-child { border-bottom: none; }
        .video-item:hover { opacity: 0.8; }
        .video-item .v-pic {
            width: 60px;
            height: 38px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--result-text-bg);
        }
        .video-item .v-info {
            flex: 1;
            min-width: 0;
        }
        .video-item .v-title {
            font-size: 14px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .video-item .v-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .video-item .v-status {
            font-size: 11px;
            flex-shrink: 0;
        }
        .video-item .v-status.extracted { color: var(--text-secondary); }
        .video-item .v-status.unextracted { color: #fb7299; font-weight: 600; }
        .video-item.extracted .v-title { color: var(--text-secondary); }
        .video-item.unextracted .v-title { color: #fb7299; }

        /* ── 关注按钮 ── */
        .follow-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border: 1px solid var(--btn-primary-bg);
            border-radius: 14px;
            background: none;
            color: var(--btn-primary-bg);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .follow-btn:hover {
            background: var(--btn-primary-bg);
            color: #fff;
        }
        .follow-btn.followed {
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }
        .follow-btn.followed:hover {
            background: #ff4444;
            border-color: #ff4444;
            color: #fff;
        }

        @media (max-width: 480px) {
            .container { padding: 20px 12px; }
            .card { padding: 16px; }
            header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>B站字幕提取 <span class="version">v1.0</span></h1>
            <div class="header-actions">
                <button class="settings-toggle" onclick="openSettings()" title="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">
                    <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="up-section" id="upSection">
            <span class="up-section-label">关注的UP主</span>
            <div class="up-list" id="upList" style="display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center"></div>
            <button class="up-add-btn" onclick="showAddUp()">+ 添加</button>
        </div>

        <div class="card">
            <div class="form-group">
                <input type="text" id="url" placeholder="粘贴 B站视频链接" autofocus>
            </div>
            <button class="btn btn-primary" id="extractBtn" onclick="extract()">提取字幕</button>
        </div>

        <div class="error-banner" id="errorBanner"></div>

        <div class="card">
            <div class="log-area" id="logArea"></div>
        </div>

        <div class="card result-area" id="resultArea">
            <div class="result-header">
                <span class="result-title" id="resultTitle"></span>
                <div class="result-actions">
                    <button class="follow-btn" id="followBtn" onclick="toggleFollow()" style="display:none"></button>
                    <button class="btn btn-secondary" onclick="copyText()">复制</button>
                </div>
            </div>
            <div class="result-text" id="resultText">处理完成，暂无文本内容</div>
            <div class="result-footer">
                <button class="btn btn-secondary" onclick="download('txt')">下载 .txt</button>
                <button class="btn btn-secondary" onclick="download('srt')">下载 .srt</button>
            </div>
        </div>

        <div class="modal-overlay" id="settingsModal" onclick="closeSettings(event)">
            <div class="modal">
                <div class="modal-header">
                    <h2>设置</h2>
                    <button class="modal-close" onclick="closeSettings()">&times;</button>
                </div>
                <div class="form-group">
                    <label for="cookies">Cookie 文件</label>
                    <input type="file" id="cookies" accept=".txt,.cookies">
                    <div class="hint">上传 B站登录 Cookie（Netscape 格式），可获取 AI 识别字幕</div>
                    <div class="cookie-status" id="cookieStatus"></div>
                </div>
            </div>
        </div>

        <!-- 视频列表弹窗 -->
        <div class="video-list-modal" id="videoListModal" onclick="closeVideoList(event)">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="videoListTitle">投稿列表</h2>
                    <button class="modal-close" onclick="closeVideoList()">&times;</button>
                </div>
                <div class="modal-body" id="videoListBody">
                    <div style="text-align:center;padding:24px;color:var(--text-secondary)">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 添加 UP 主弹窗 -->
        <div class="modal-overlay" id="addUpModal" onclick="closeAddUp(event)">
            <div class="modal">
                <div class="modal-header">
                    <h2>添加关注的 UP 主</h2>
                    <button class="modal-close" onclick="closeAddUp()">&times;</button>
                </div>
                <div class="form-group">
                    <input type="text" id="upKeyword" placeholder="输入 UP 主名称或空间链接" onkeydown="if(event.key==='Enter') confirmAddUp()">
                </div>
                <div id="addUpResult" style="font-size:13px;color:var(--text-secondary);margin-bottom:8px"></div>
                <button class="btn btn-primary" onclick="confirmAddUp()">搜索并关注</button>
            </div>
        </div>

        <footer>
        </footer>
    </div>

    <script>
        // ── 配置：部署时由 GitHub Actions 替换为真实地址 ──
        const WORKER_URL = "__WORKER_URL__";

        let _result = null;

        // ── 主题 ──
        function getTheme() {
            return localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            icon.classList.remove('moon', 'sun');
            if (theme === 'dark') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
                icon.classList.add('moon');
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
                icon.classList.add('sun');
            }
            localStorage.setItem('theme', theme);
        }
        function toggleTheme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
        applyTheme(getTheme());

        // ── 设置弹窗 ──
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }
        function closeSettings(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('settingsModal').classList.remove('active');
        }

        // ── Cookie 持久化 ──
        const COOKIE_KEY = 'bili_cookie';

        function saveCookieContent(text) {
            try { localStorage.setItem(COOKIE_KEY, text); } catch(e) {}
            updateCookieIndicator();
        }

        function clearCookie() {
            localStorage.removeItem(COOKIE_KEY);
            document.getElementById('cookies').value = '';
            updateCookieIndicator();
        }

        function getSavedCookie() {
            return localStorage.getItem(COOKIE_KEY);
        }

        function updateCookieIndicator() {
            const el = document.getElementById('cookieStatus');
            const saved = getSavedCookie();
            if (saved) {
                el.innerHTML = '<span class="saved">\u2713 Cookie \u5df2\u4fdd\u5b58</span><button class="btn-link" onclick="clearCookie()">\u6e05\u9664</button>';
            } else {
                el.innerHTML = '';
            }
        }

        document.getElementById('cookies').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) { saveCookieContent(ev.target.result); };
            reader.readAsText(file);
        });
        updateCookieIndicator();

        // ── UP 主管理 ──
        const FOLLOWED_KEY = 'followed_ups';
        const EXTRACTED_KEY = 'extracted_videos';

        // ── 初始化 UP 主列表 ──
        renderUpList();

        // ── 日志 ──
        function log(msg, type) {
            const el = document.getElementById('logArea');
            el.classList.add('active');
            const cls = type === 'error' ? 'log-error' : type === 'warn' ? 'log-warn' : 'log-info';
            el.innerHTML += `<span class="${cls}">${escapeHtml(msg)}</span>\n`;
            el.scrollTop = el.scrollHeight;
        }
        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function clearLog() { document.getElementById('logArea').innerHTML = ''; document.getElementById('logArea').classList.remove('active'); }
        function showError(msg) { const el = document.getElementById('errorBanner'); el.textContent = msg; el.classList.add('active'); }
        function hideError() { document.getElementById('errorBanner').classList.remove('active'); }

        function showResult(result) {
            _result = result;
            document.getElementById('resultArea').classList.add('active');
            document.getElementById('resultTitle').textContent = result.title || '视频文本';
            const header = buildTxtHeader(result.title, result.uploader, result.pubdate);
            document.getElementById('resultText').textContent = header + (result.text || '（无文本内容）');
            // 显示关注按钮
            updateFollowBtn(result.uploader, result.uploader_mid);
        }

        function setLoading(loading) {
            const btn = document.getElementById('extractBtn');
            btn.disabled = loading;
            btn.innerHTML = loading ? '<span class="spinner"></span>处理中…' : '提取字幕';
        }

        function buildTxtHeader(title, uploader, pubdate) {
            const lines = [];
            if (title) lines.push('标题：' + title);
            if (pubdate) {
                const d = new Date(pubdate * 1000);
                const pad = n => String(n).padStart(2, '0');
                lines.push('日期：' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
            }
            if (uploader) lines.push('发布者：' + uploader);
            lines.push('');
            return lines.join('\n');
        }

        // ── 复制 ──
        function copyText() {
            if (!_result) return;
            const header = buildTxtHeader(_result.title, _result.uploader, _result.pubdate);
            const content = header + (_result.text || '');
            if (!content) { log('没有可复制的内容', 'warn'); return; }
            navigator.clipboard.writeText(content).then(function() {
                log('已复制到剪贴板');
            }).catch(function() {
                log('复制失败，请手动选择文本复制', 'error');
            });
        }

        // ── 提取字幕 ──
        async function extract() {
            if (!WORKER_URL.startsWith("http")) {
                showError('页面缺少后端地址（' + WORKER_URL + ' 未被替换）。线上版本会自动注入，本地调试请改用 wrangler dev。');
                return;
            }

            const urlInput = document.getElementById('url');
            let url = urlInput.value.trim();
            if (!url) {
                log('输入框为空，尝试读取剪贴板...', 'info');
                try {
                    if (!navigator.clipboard || !navigator.clipboard.readText) {
                        showError('输入框为空，且浏览器不支持读取剪贴板。请手动粘贴视频链接');
                        urlInput.focus();
                        return;
                    }
                    const text = await navigator.clipboard.readText();
                    url = text.trim();
                    if (url) {
                        urlInput.value = url;
                        log('已从剪贴板读取链接，开始提取', 'info');
                    } else {
                        showError('剪贴板为空，请复制 B站视频链接后重试');
                        urlInput.focus();
                        return;
                    }
                } catch(e) {
                    log('读取剪贴板失败: ' + e.message, 'warn');
                    showError('输入框为空，且无法读取剪贴板。请手动粘贴视频链接');
                    urlInput.focus();
                    return;
                }
            }

            hideError();
            clearLog();
            document.getElementById('resultArea').classList.remove('active');
            _result = null;
            setLoading(true);

            const formData = new FormData();
            formData.append('url', url);
            const fileInput = document.getElementById('cookies');
            if (fileInput.files.length > 0) {
                formData.append('cookies', fileInput.files[0]);
            } else {
                const savedCookie = getSavedCookie();
                if (savedCookie) {
                    formData.append('cookies', new Blob([savedCookie], { type: 'text/plain' }), 'cookies.txt');
                }
            }

            try {
                const resp = await fetch(WORKER_URL + '/api/extract', { method: 'POST', body: formData });
                const data = await resp.json();

                if (data.messages && data.messages.length) {
                    for (const msg of data.messages) log(msg);
                }

                if (data.success && data.text) {
                    const name = [data.title, data.uploader, data.pubdate ? new Date(data.pubdate * 1000).toISOString().slice(0, 10) : ''].filter(Boolean).join('_').replace(/[<>:"/\\|?*]/g, '_');
                    data.download_name = name;
                    // 记录已提取的视频
                    if (data.uploader_mid) {
                        recordExtracted(data.uploader_mid, data.uploader, data.title);
                    }
                    showResult(data);
                } else if (data.success && !data.text) {
                    log('处理完成，但未提取到文本内容', 'warn');
                } else {
                    log(data.error || '处理失败', 'error');
                    showError(data.error || '处理失败，请检查链接是否正确');
                }
            } catch (err) {
                log('请求失败: ' + err.message, 'error');
                showError('请求失败，请检查 Worker 地址是否正确');
            } finally {
                setLoading(false);
            }
        }

        // ── 下载 ──
        function download(fmt) {
            if (!_result) return;
            const name = (_result.download_name || 'subtitle') + '.' + fmt;
            let content;
            if (fmt === 'srt') {
                content = _result.srt_content || '';
            } else {
                content = buildTxtHeader(_result.title, _result.uploader, _result.pubdate) + (_result.text || '');
            }
            if (!content) { log('没有可用的 ' + fmt.toUpperCase() + ' 内容', 'warn'); return; }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.getElementById('url').addEventListener('keydown', function(e) { if (e.key === 'Enter') extract(); });

        // ── UP 主管理 ──
        let _currentUpMid = null; // 当前结果对应的 UP 主 MID

        function getFollowedUps() {
            try { return JSON.parse(localStorage.getItem(FOLLOWED_KEY)) || []; } catch { return []; }
        }
        function saveFollowedUps(list) {
            localStorage.setItem(FOLLOWED_KEY, JSON.stringify(list));
            renderUpList();
        }
        function getExtractedVideos() {
            try { return JSON.parse(localStorage.getItem(EXTRACTED_KEY)) || {}; } catch { return {}; }
        }
        function saveExtractedVideos(obj) {
            localStorage.setItem(EXTRACTED_KEY, JSON.stringify(obj));
        }

        function recordExtracted(mid, name, title) {
            const extracted = getExtractedVideos();
            const key = name + '/' + mid;
            if (!extracted[key]) extracted[key] = {};
            extracted[key][title] = Date.now();
            saveExtractedVideos(extracted);
        }

        function isVideoExtracted(mid, name, title) {
            const extracted = getExtractedVideos();
            const key = name + '/' + mid;
            return extracted[key] && extracted[key][title] ? true : false;
        }

        function renderUpList() {
            const list = getFollowedUps();
            const container = document.getElementById('upList');
            if (list.length === 0) {
                container.innerHTML = '<span style="font-size:12px;color:var(--text-secondary)">暂无关注的 UP 主</span>';
                return;
            }
            container.innerHTML = list.map(up =>
                `<span class="up-pill" onclick="showUpVideos('${up.mid}','${escapeHtml(up.name)}')" title="查看投稿">
                    ${escapeHtml(up.name)}
                    <span class="up-remove" onclick="event.stopPropagation();removeUp('${up.mid}')" title="取消关注">&times;</span>
                </span>`
            ).join('');
        }

        function removeUp(mid) {
            const list = getFollowedUps().filter(u => String(u.mid) !== String(mid));
            saveFollowedUps(list);
            log('已取消关注', 'info');
        }

        function toggleFollow() {
            const list = getFollowedUps();
            const idx = list.findIndex(u => String(u.mid) === String(_currentUpMid));
            if (idx >= 0) {
                list.splice(idx, 1);
                saveFollowedUps(list);
                log('已取消关注', 'info');
            } else {
                const name = document.getElementById('resultTitle').textContent.split(' ')[0];
                list.push({ mid: _currentUpMid, name: _result.uploader, followedAt: Date.now() });
                saveFollowedUps(list);
                log('已关注 UP 主：' + _result.uploader, 'info');
            }
            updateFollowBtn(_result.uploader, _currentUpMid);
        }

        function updateFollowBtn(name, mid) {
            const btn = document.getElementById('followBtn');
            _currentUpMid = mid;
            if (!name || !mid) { btn.style.display = 'none'; return; }
            btn.style.display = 'inline-flex';
            const list = getFollowedUps();
            const followed = list.some(u => String(u.mid) === String(mid));
            btn.className = 'follow-btn' + (followed ? ' followed' : '');
            btn.textContent = followed ? '已关注 ✓' : '+ 关注UP';
        }

        // ── 添加 UP 主 ──
        function showAddUp() {
            document.getElementById('addUpModal').classList.add('active');
            document.getElementById('upKeyword').value = '';
            document.getElementById('addUpResult').textContent = '';
            setTimeout(() => document.getElementById('upKeyword').focus(), 100);
        }
        function closeAddUp(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('addUpModal').classList.remove('active');
        }
        async function confirmAddUp() {
            const keyword = document.getElementById('upKeyword').value.trim();
            if (!keyword) { document.getElementById('addUpResult').textContent = '请输入 UP 主名称或空间链接'; return; }
            document.getElementById('addUpResult').textContent = '搜索中...';
            try {
                const resp = await fetch(WORKER_URL + '/api/search-up', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('addUpResult').textContent = data.error;
                    return;
                }
                const list = getFollowedUps();
                if (list.some(u => String(u.mid) === String(data.mid))) {
                    document.getElementById('addUpResult').textContent = '已关注该 UP 主';
                    return;
                }
                list.push({ mid: data.mid, name: data.name, followedAt: Date.now() });
                saveFollowedUps(list);
                closeAddUp();
                log('已关注 UP 主：' + data.name, 'info');
            } catch (e) {
                document.getElementById('addUpResult').textContent = '搜索失败: ' + e.message;
            }
        }

        // ── 视频列表 ──
        function closeVideoList(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('videoListModal').classList.remove('active');
        }
        async function showUpVideos(mid, name) {
            const modal = document.getElementById('videoListModal');
            const body = document.getElementById('videoListBody');
            const title = document.getElementById('videoListTitle');
            title.textContent = name + ' 的投稿';
            modal.classList.add('active');
            body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-secondary)">加载中...</div>';

            try {
                const resp = await fetch(WORKER_URL + '/api/up-videos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mid, name })
                });
                const data = await resp.json();
                if (data.error) {
                    body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--log-error)">' + escapeHtml(data.error) + '</div>';
                    return;
                }
                if (!data.videos || data.videos.length === 0) {
                    body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-secondary)">暂无投稿</div>';
                    return;
                }
                body.innerHTML = '';
                for (const v of data.videos) {
                    const extracted = isVideoExtracted(mid, name, v.title);
                    const statusClass = extracted ? 'extracted' : 'unextracted';
                    const statusText = extracted ? '已提取' : '未提取';
                    const d = new Date(v.created * 1000);
                    const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                    const item = document.createElement('div');
                    item.className = 'video-item ' + statusClass;
                    item.innerHTML =
                        '<img class="v-pic" src="' + (v.pic || '') + '" alt="" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2238%22><rect fill=%22%23eee%22 width=%2260%22 height=%2238%22/></svg>\'">' +
                        '<div class="v-info"><div class="v-title">' + escapeHtml(v.title) + '</div><div class="v-meta">' + dateStr + ' | ' + (v.length || '') + '</div></div>' +
                        '<span class="v-status ' + statusClass + '">' + statusText + '</span>';
                    item.onclick = function() { extractFromBvid(v.bvid, name, mid); };
                    body.appendChild(item);
                }
            } catch (e) {
                body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--log-error)">加载失败: ' + escapeHtml(e.message) + '</div>';
            }
        }

        // ── 从视频列表提取字幕 ──
        async function extractFromBvid(bvid, upName, upMid) {
            closeVideoList();
            document.getElementById('url').value = 'https://www.bilibili.com/video/' + bvid;
            await extract();
        }
    </script>
</body>
</html>
