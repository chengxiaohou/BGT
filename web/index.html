<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站字幕提取</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --card-bg: #fff;
            --card-shadow: rgba(0,0,0,0.08);
            --input-border: #d2d2d7;
            --input-focus: #0071e3;
            --input-focus-shadow: rgba(0,113,227,0.15);
            --btn-primary-bg: #0071e3;
            --btn-primary-hover: #0060c9;
            --btn-primary-disabled: #999;
            --btn-secondary-bg: #e8e8ed;
            --btn-secondary-hover: #d2d2d7;
            --btn-secondary-text: #1d1d1f;
            --log-bg: #1d1d1f;
            --log-text: #a1ef80;
            --log-error: #ff6b6b;
            --log-warn: #ffd93d;
            --result-text-bg: #fafafa;
            --result-text-border: #e8e8ed;
            --error-bg: #fff0f0;
            --error-border: #ffc0c0;
            --error-text: #c41e3a;
            --label-text: #333;
            --footer-link: #86868b;
            --footer-link-hover: #1d1d1f;
            --toggle-bg: #e8e8ed;
            --toggle-hover: #d2d2d7;
        }

        [data-theme="dark"] {
            --bg: #1a1a1e;
            --text: #e5e5e7;
            --text-secondary: #8e8e93;
            --card-bg: #2c2c2e;
            --card-shadow: rgba(0,0,0,0.3);
            --input-border: #48484a;
            --input-focus: #0a84ff;
            --input-focus-shadow: rgba(10,132,255,0.2);
            --btn-primary-bg: #0a84ff;
            --btn-primary-hover: #409cff;
            --btn-primary-disabled: #555;
            --btn-secondary-bg: #3a3a3c;
            --btn-secondary-hover: #48484a;
            --btn-secondary-text: #e5e5e7;
            --log-bg: #111;
            --log-text: #5cd45c;
            --log-error: #ff6b6b;
            --log-warn: #ffd93d;
            --result-text-bg: #1c1c1e;
            --result-text-border: #38383a;
            --error-bg: #3a1a1a;
            --error-border: #6b2a2a;
            --error-text: #ff6b6b;
            --label-text: #d1d1d6;
            --footer-link: #8e8e93;
            --footer-link-hover: #e5e5e7;
            --toggle-bg: #3a3a3c;
            --toggle-hover: #48484a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }
        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        header p {
            color: var(--text-secondary);
            margin-top: 6px;
            font-size: 14px;
        }
        .theme-toggle {
            position: absolute;
            right: 0;
            top: 0;
            background: var(--toggle-bg);
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            line-height: 1;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }
        .theme-toggle:hover { background: var(--toggle-hover); }
        .theme-toggle svg { display: block; }
        .theme-toggle .moon { color: #e8e8ed; }
        .theme-toggle .sun { color: var(--text); }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 3px var(--card-shadow);
            transition: background 0.2s, box-shadow 0.2s;
            margin-top: 16px;
        }
        .card:first-of-type { margin-top: 0; }
        .card:has(> .log-area:not(.active)) { display: none; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--label-text);
        }
        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--card-bg);
            color: var(--text);
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--input-focus-shadow);
        }
        .form-group input[type="file"] {
            padding: 8px 0;
            border: none;
            font-size: 14px;
        }
        .form-group input[type="file"]::file-selector-button {
            padding: 6px 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--btn-secondary-bg);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }
        .form-group input[type="file"]::file-selector-button:hover {
            background: var(--btn-secondary-hover);
        }
        .form-group .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--btn-primary-bg);
            color: #fff;
            width: 100%;
        }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-primary:disabled {
            background: var(--btn-primary-disabled);
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            font-size: 13px;
            padding: 6px 16px;
        }
        .btn-secondary:hover { background: var(--btn-secondary-hover); }

        .log-area {
            background: var(--log-bg);
            color: var(--log-text);
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            font-size: 13px;
            padding: 16px;
            border-radius: 8px;
            max-height: 240px;
            overflow-y: auto;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
        .log-area.active { display: block; }
        .log-area .log-error { color: var(--log-error); }
        .log-area .log-info { color: var(--log-text); }
        .log-area .log-warn { color: var(--log-warn); }

        .result-area { display: none; }
        .result-area.active { display: block; }
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .result-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .result-text {
            background: var(--result-text-bg);
            border: 1px solid var(--result-text-border);
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.7;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            transition: background 0.2s, border-color 0.2s;
        }

        .error-banner {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--error-text);
            font-size: 14px;
            display: none;
        }
        .error-banner.active { display: block; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--footer-link);
            font-size: 12px;
        }
        footer .version { margin-right: 8px; }
        footer a { color: var(--footer-link); text-decoration: underline; transition: color 0.2s; }
        footer a:hover { color: var(--footer-link-hover); }

        @media (max-width: 480px) {
            .container { padding: 20px 12px; }
            .card { padding: 16px; }
            header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>B站字幕提取</h1>
            <p>粘贴 B站视频链接，获取 AI 字幕 / CC 字幕</p>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">
                <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
            </button>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="url">B站视频链接</label>
                <input type="text" id="url" placeholder="粘贴 B站视频链接，如 https://www.bilibili.com/video/BV1xx…" autofocus>
            </div>
            <div class="form-group">
                <label for="cookies">Cookie 文件（可选）</label>
                <input type="file" id="cookies" accept=".txt,.cookies">
                <div class="hint">上传 B站登录 Cookie（Netscape 格式），可获取 AI 识别字幕。如没有可跳过，仅使用公开 CC 字幕。</div>
            </div>
            <button class="btn btn-primary" id="extractBtn" onclick="extract()">提取字幕</button>
        </div>

        <div class="error-banner" id="errorBanner"></div>

        <div class="card">
            <div class="log-area" id="logArea"></div>
        </div>

        <div class="card result-area" id="resultArea">
            <div class="result-header">
                <span class="result-title" id="resultTitle"></span>
                <div class="result-actions">
                    <button class="btn btn-secondary" onclick="download('txt')">下载 .txt</button>
                    <button class="btn btn-secondary" onclick="download('srt')">下载 .srt</button>
                </div>
            </div>
            <div class="result-text" id="resultText">处理完成，暂无文本内容</div>
        </div>

        <footer>
            <span class="version">v0.1.1</span>
            <a href="https://github.com/chengxiaohou/BGT" target="_blank">Bili-Subtitles（GitHub 仓库）</a>
        </footer>
    </div>

    <script>
        // ── 配置：部署时替换为实际 Worker 地址 ──
        const WORKER_URL = "__WORKER_URL__";

        let _result = null;

        // ── 主题 ──
        function getTheme() {
            return localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            icon.classList.remove('moon', 'sun');
            if (theme === 'dark') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
                icon.classList.add('moon');
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
                icon.classList.add('sun');
            }
            localStorage.setItem('theme', theme);
        }
        function toggleTheme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
        applyTheme(getTheme());

        // ── 日志 ──
        function log(msg, type) {
            const el = document.getElementById('logArea');
            el.classList.add('active');
            const cls = type === 'error' ? 'log-error' : type === 'warn' ? 'log-warn' : 'log-info';
            el.innerHTML += `<span class="${cls}">${escapeHtml(msg)}</span>\n`;
            el.scrollTop = el.scrollHeight;
        }
        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function clearLog() { document.getElementById('logArea').innerHTML = ''; document.getElementById('logArea').classList.remove('active'); }
        function showError(msg) { const el = document.getElementById('errorBanner'); el.textContent = msg; el.classList.add('active'); }
        function hideError() { document.getElementById('errorBanner').classList.remove('active'); }

        function showResult(result) {
            _result = result;
            document.getElementById('resultArea').classList.add('active');
            document.getElementById('resultTitle').textContent = result.title || '视频文本';
            document.getElementById('resultText').textContent = result.text || '（无文本内容）';
        }

        function setLoading(loading) {
            const btn = document.getElementById('extractBtn');
            btn.disabled = loading;
            btn.innerHTML = loading ? '<span class="spinner"></span>处理中…' : '提取字幕';
        }

        function buildTxtHeader(title, uploader, pubdate) {
            const lines = [];
            if (title) lines.push('标题：' + title);
            if (pubdate) {
                const d = new Date(pubdate * 1000);
                const pad = n => String(n).padStart(2, '0');
                lines.push('日期：' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
            }
            if (uploader) lines.push('发布者：' + uploader);
            lines.push('');
            return lines.join('\n');
        }

        // ── 提取字幕 ──
        async function extract() {
            if (!WORKER_URL.startsWith("http")) {
                showError('页面缺少后端地址（' + WORKER_URL + ' 未被替换）。线上版本会自动注入，本地调试请改用 wrangler dev。');
                return;
            }

            const url = document.getElementById('url').value.trim();
            if (!url) { showError('请输入 B站视频链接'); document.getElementById('url').focus(); return; }

            hideError();
            clearLog();
            document.getElementById('resultArea').classList.remove('active');
            _result = null;
            setLoading(true);

            const formData = new FormData();
            formData.append('url', url);
            const fileInput = document.getElementById('cookies');
            if (fileInput.files.length > 0) {
                formData.append('cookies', fileInput.files[0]);
            }

            try {
                const resp = await fetch(WORKER_URL + '/api/extract', { method: 'POST', body: formData });
                const data = await resp.json();

                if (data.messages && data.messages.length) {
                    for (const msg of data.messages) log(msg);
                }

                if (data.success && data.text) {
                    const name = [data.title, data.uploader, data.pubdate ? new Date(data.pubdate * 1000).toISOString().slice(0, 10) : ''].filter(Boolean).join('_').replace(/[<>:"/\\|?*]/g, '_');
                    data.download_name = name;
                    showResult(data);
                } else if (data.success && !data.text) {
                    log('处理完成，但未提取到文本内容', 'warn');
                } else {
                    log(data.error || '处理失败', 'error');
                    showError(data.error || '处理失败，请检查链接是否正确');
                }
            } catch (err) {
                log('请求失败: ' + err.message, 'error');
                showError('请求失败，请检查 Worker 地址是否正确');
            } finally {
                setLoading(false);
            }
        }

        // ── 下载 ──
        function download(fmt) {
            if (!_result) return;
            const name = (_result.download_name || 'subtitle') + '.' + fmt;
            let content;
            if (fmt === 'srt') {
                content = _result.srt_content || '';
            } else {
                content = buildTxtHeader(_result.title, _result.uploader, _result.pubdate) + (_result.text || '');
            }
            if (!content) { log('没有可用的 ' + fmt.toUpperCase() + ' 内容', 'warn'); return; }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.getElementById('url').addEventListener('keydown', function(e) { if (e.key === 'Enter') extract(); });
    </script>
</body>
</html>
