[tool.poetry]
name = "bili-subtitles"
version = "0.1.0"
description = "提取B站视频文本内容的命令行工具"
authors = ["chengxiaohou <chengxiaohou@gmail.com>"]

[tool.poetry.scripts]
bili-subtitles = "bili_subtitles.cli:main"
bili-subtitles-interactive = "bili_subtitles.interactive:main"

[tool.poetry.dependencies]
python = ">=3.10"
requests = "^2.31.0"
click = "^8.1.7"
yt-dlp = "^2024.4.9"
beautifulsoup4 = "^4.12.3"
lxml = "^5.2.1"
sherpa-onnx = "^1.13.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
